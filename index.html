<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triple Pendulum Stability</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">
        <div id="simulation-container">
            <canvas id="simCanvas"></canvas>
            <div id="overlay">
                <h1>Triple Pendulum</h1>
                <p>Interactive Chaos Explorer</p>
            </div>
        </div>
        <div id="controls-container">
            <div id="heatmap-container">
                <canvas id="heatmapCanvas"></canvas>
                <div id="heatmap-ui">
                    <button id="heatmap-max-btn" title="Toggle Fullscreen">⛶</button>
                    <button id="heatmap-reset-view-btn" title="Reset View">↺</button>
                    <div id="heatmap-status">Generating...</div>
                </div>
            </div>
            <div class="controls">
                <div class="control-group">
                    <label>Mass 1 <span id="m1-val">1.0</span></label>
                    <input type="range" id="m1" min="0.1" max="5" step="0.1" value="1.0">
                </div>
                <div class="control-group">
                    <label>Mass 2 <span id="m2-val">1.0</span></label>
                    <input type="range" id="m2" min="0.1" max="5" step="0.1" value="1.0">
                </div>
                <div class="control-group">
                    <label>Mass 3 <span id="m3-val">1.0</span></label>
                    <input type="range" id="m3" min="0.1" max="5" step="0.1" value="1.0">
                </div>
                <div class="control-group">
                    <label>Length 1 <span id="l1-val">1.0</span></label>
                    <input type="range" id="l1" min="0.1" max="3" step="0.1" value="1.0">
                </div>
                <div class="control-group">
                    <label>Length 2 <span id="l2-val">1.0</span></label>
                    <input type="range" id="l2" min="0.1" max="3" step="0.1" value="1.0">
                </div>
                <div class="control-group">
                    <label>Length 3 <span id="l3-val">1.0</span></label>
                    <input type="range" id="l3" min="0.1" max="3" step="0.1" value="1.0">
                </div>
                <div class="control-group">
                    <label>Gravity <span id="g-val">9.8</span></label>
                    <input type="range" id="g" min="0" max="20" step="0.1" value="9.81">
                </div>
                <div class="control-group">
                    <label>Damping <span id="d-val">0.0</span></label>
                    <input type="range" id="d" min="0" max="1" step="0.01" value="0.0">
                </div>
                <button id="reset-btn">Reset Simulation</button>
            </div>
        </div>
    </div>
    <script src="simulation.js" type="module"></script>
</body>

</html>
